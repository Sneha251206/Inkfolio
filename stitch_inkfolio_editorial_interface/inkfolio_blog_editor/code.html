<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editor | InkFolio</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                    "surface-dim": "#dcd9d9",
                    "background-primary": "#FFFFFF",

                    "background-secondary": "#FAFAFA",

                    "inverse-on-surface": "#f3f0ef",
                    "primary-fixed": "#afefdd",
                    "tertiary-container": "#693527",
                    "tertiary-fixed": "#ffdbd1",
                    "on-tertiary": "#ffffff",
                    "divider": "#E6E6E6",
                    "on-tertiary-container": "#e89f8c",
                    "outline": "#707975",
                    "on-secondary": "#ffffff",
                    "text-muted": "#6B6B6B",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "tertiary": "#4e2013",
                    "surface-container-highest": "#e5e2e1",
                    "on-secondary-fixed-variant": "#802a00",
                    "inverse-primary": "#94d3c1",
                    "secondary-container": "#fc6018",
                    "on-surface-variant": "#3f4945",
                    "inverse-surface": "#313030",

                    "surface-container-lowest": "#ffffff",
                    "secondary": "#a83900",
                    "surface-variant": "#e5e2e1",
                    "on-secondary-container": "#531800",
                    "on-tertiary-fixed": "#370e04",
                    "secondary-fixed-dim": "#ffb59a",
                    "surface-container-high": "#eae7e7",
                    "surface-container": "#f0eded",
                    "on-error-container": "#93000a",
                    "on-surface": "#1c1b1b",
                    "surface-container-low": "#f6f3f2",
                    "surface-bright": "#fcf9f8",
                    "on-primary-fixed": "#00201a",
                    "error": "#ba1a1a",
                    "surface": "#fcf9f8",

            "borderRadius": {

<style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .editable:empty:before {
            content: attr(data-placeholder);
            color: #A3A3A3;
        }

        .custom-dashed-border {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' stroke='%23BFC9C4' stroke-width='2' stroke-dasharray='8%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }

        .transition-sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .focus-line {
            transition: width 0.3s ease;
            width: 0;
        }
        
        .input-group:focus-within .focus-line {
            width: 100%;
        }
    </style>
</head>
<body class="bg-background text-on-surface selection:bg-primary/10">
<!-- Top Navigation Bar (Shared Component Style) -->
<header class="sticky top-0 w-full z-50 bg-background border-b border-divider h-16 flex items-center px-margin-mobile md:px-stack-lg transition-all duration-200">
<div class="flex items-center gap-stack-md flex-1">
<button class="flex items-center text-on-surface hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2 text-text-muted">
<span class="material-symbols-outlined text-[18px]">cloud_done</span>
<span class="font-ui-label-md text-ui-label-md">Saved</span>
</div>
</div>
<div class="flex items-center gap-stack-md">
<div class="bg-surface-container-low rounded-full p-1 flex items-center">
<button class="px-4 py-1 rounded-full font-ui-label-sm text-ui-label-sm bg-white shadow-sm text-primary">Draft</button>
<button class="px-4 py-1 rounded-full font-ui-label-sm text-ui-label-sm text-text-muted hover:text-on-surface">Preview</button>
</div>
<button class="bg-primary-container text-on-primary font-ui-label-lg text-ui-label-lg px-6 py-2 rounded-lg hover:opacity-90 transition-opacity">
                Publish
            </button>
</div>
</header>
<main class="flex min-h-[calc(100vh-64px)] overflow-hidden relative">
<!-- Editor Canvas -->
<section class="flex-1 overflow-y-auto px-margin-mobile pt-stack-xl pb-32 no-scrollbar">
<div class="max-w-[700px] mx-auto relative">
<!-- Writing Area -->
<div class="space-y-stack-md">
<div class="input-group relative">
<div class="editable outline-none font-display-lg text-display-lg text-on-surface empty:before:content-[attr(data-placeholder)]" contenteditable="true" data-placeholder="Title of your story..."></div>
<div class="focus-line absolute -bottom-2 left-0 h-[2px] bg-primary"></div>
</div>
<div class="input-group relative pb-stack-md">
<div class="editable outline-none font-headline-sm text-headline-sm text-text-muted italic empty:before:content-[attr(data-placeholder)]" contenteditable="true" data-placeholder="Add a subtitle..."></div>
<div class="focus-line absolute bottom-0 left-0 h-[1px] bg-outline-variant"></div>
</div>
<div class="editable outline-none font-body-lg text-body-lg text-on-surface min-h-[512px] empty:before:content-[attr(data-placeholder)] mt-stack-md" contenteditable="true" data-placeholder="Tell your story..." id="editor-body">
                        The ink flows where the mind wanders. Start your journey here...
                    </div>
</div>
<!-- Floating Toolbar -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-on-background text-white rounded-full px-6 py-3 flex items-center gap-6 shadow-xl z-40 transition-all transform scale-100 opacity-100" id="floating-toolbar">
<button class="hover:text-primary-fixed-dim transition-colors" title="Bold"><span class="material-symbols-outlined">format_bold</span></button>
<button class="hover:text-primary-fixed-dim transition-colors" title="Italic"><span class="material-symbols-outlined">format_italic</span></button>
<button class="hover:text-primary-fixed-dim transition-colors" title="Link"><span class="material-symbols-outlined">link</span></button>
<div class="w-[1px] h-4 bg-white/20"></div>
<button class="hover:text-primary-fixed-dim transition-colors" title="Quote"><span class="material-symbols-outlined">format_quote</span></button>
<button class="hover:text-primary-fixed-dim transition-colors" title="Heading"><span class="material-symbols-outlined">title</span></button>
<button class="hover:text-primary-fixed-dim transition-colors" title="List"><span class="material-symbols-outlined">format_list_bulleted</span></button>
<div class="w-[1px] h-4 bg-white/20"></div>
<button class="hover:text-primary-fixed-dim transition-colors" title="Image"><span class="material-symbols-outlined">image</span></button>
</div>
</div>
</section>
<!-- Right Side Collapsible Panel: Publish Settings -->
<aside class="w-[380px] bg-white border-l border-divider h-full overflow-y-auto transition-sidebar z-50" id="publish-sidebar">
<div class="p-8 space-y-stack-lg">
<div class="flex items-center justify-between">
<h2 class="font-ui-label-lg text-ui-label-lg text-on-surface">Publish Settings</h2>
<button class="p-1 hover:bg-surface-container-low rounded-full transition-colors" id="close-sidebar">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Cover Image -->
<div class="space-y-stack-sm">
<label class="font-ui-label-md text-ui-label-md text-text-muted">Story Preview Image</label>
<div class="custom-dashed-border rounded-lg aspect-video flex flex-col items-center justify-center p-6 text-center cursor-pointer hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors text-display-lg-mobile">add_a_photo</span>
<p class="font-ui-label-sm text-ui-label-sm text-text-muted mt-2">Upload a high-resolution cover image</p>
</div>
</div>
<!-- Tags -->
<div class="space-y-stack-sm">
<label class="font-ui-label-md text-ui-label-md text-text-muted">Tags (up to 5)</label>
<input class="w-full bg-surface-container-lowest border-divider rounded-lg px-4 py-3 font-ui-label-md text-ui-label-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Add a tag..." type="text"/>
<div class="flex flex-wrap gap-2 pt-2">
<span class="bg-surface-container text-on-surface-variant px-3 py-1 rounded-full font-ui-label-sm text-ui-label-sm flex items-center gap-1">Writing <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span></span>
<span class="bg-surface-container text-on-surface-variant px-3 py-1 rounded-full font-ui-label-sm text-ui-label-sm flex items-center gap-1">Design <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span></span>
</div>
</div>
<!-- Excerpt -->
<div class="space-y-stack-sm">
<label class="font-ui-label-md text-ui-label-md text-text-muted">SEO Excerpt</label>
<textarea class="w-full bg-surface-container-lowest border-divider rounded-lg px-4 py-3 font-ui-label-md text-ui-label-md focus:ring-1 focus:ring-primary focus:border-primary outline-none resize-none transition-all" placeholder="A brief summary for your readers..." rows="3"></textarea>
</div>
<!-- Publish Plan -->
<div class="space-y-stack-sm">
<label class="font-ui-label-md text-ui-label-md text-text-muted">Publishing Plan</label>
<div class="grid grid-cols-1 gap-3">
<label class="relative flex items-center p-4 border border-primary bg-primary/5 rounded-xl cursor-pointer group transition-all">
<input checked="" class="sr-only" name="plan" type="radio"/>
<div class="flex-1">
<p class="font-ui-label-md text-ui-label-md text-primary font-bold">Pay Per Blog</p>
<p class="font-ui-label-sm text-ui-label-sm text-text-muted">One-time editorial review</p>
</div>
<span class="font-ui-label-lg text-ui-label-lg text-primary">$5</span>
</label>
<label class="relative flex items-center p-4 border border-divider rounded-xl cursor-pointer group hover:border-outline transition-all">
<input class="sr-only" name="plan" type="radio"/>
<div class="flex-1">
<p class="font-ui-label-md text-ui-label-md text-on-surface">Monthly Subscription</p>
<p class="font-ui-label-sm text-ui-label-sm text-text-muted">Unlimited monthly posts</p>
</div>
<span class="font-ui-label-lg text-ui-label-lg text-on-surface">$15</span>
</label>
</div>
</div>
<!-- Payment Method -->
<div class="space-y-stack-sm">
<label class="font-ui-label-md text-ui-label-md text-text-muted">Payment Method</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border-divider rounded-lg px-4 py-3 font-ui-label-md text-ui-label-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all">
<option>•••• 4242 — Visa</option>
<option>•••• 9876 — Mastercard</option>
<option>Add New Card...</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted">expand_more</span>
</div>
</div>
<div class="pt-stack-md">
<button class="w-full bg-secondary-container text-on-secondary-container font-ui-label-lg text-ui-label-lg py-4 rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
                        Submit for Review
                        <span class="material-symbols-outlined">send</span>
</button>
<p class="text-center font-ui-label-sm text-ui-label-sm text-text-muted mt-4">Estimated review time: 12-24 hours.</p>
</div>
</div>
</aside>
</main>
<!-- Micro-interactions Script -->
<script>
        const sidebar = document.getElementById('publish-sidebar');
        const closeBtn = document.getElementById('close-sidebar');
        const toolbar = document.getElementById('floating-toolbar');
        const editorBody = document.getElementById('editor-body');

        // Toggle Sidebar visibility
        closeBtn.addEventListener('click', () => {
            sidebar.style.width = '0px';
            sidebar.style.borderLeft = 'none';
            sidebar.style.overflow = 'hidden';
        });

        // Simple toolbar appearance logic
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            let st = window.pageYOffset || document.documentElement.scrollTop;
            if (st > lastScrollTop) {
                // Downscroll
                toolbar.style.transform = 'translateX(-50%) translateY(100px)';
                toolbar.style.opacity = '0';
            } else {
                // Upscroll
                toolbar.style.transform = 'translateX(-50%) translateY(0)';
                toolbar.style.opacity = '1';
            }
            lastScrollTop = st <= 0 ? 0 : st;
        }, false);

        // Mimic active state of plans
        const planLabels = document.querySelectorAll('label[plan]');
        document.querySelectorAll('input[name="plan"]').forEach(input => {
            input.addEventListener('change', (e) => {
                document.querySelectorAll('input[name="plan"]').forEach(i => {
                    const parent = i.parentElement;
                    parent.classList.remove('border-primary', 'bg-primary/5');
                    parent.classList.add('border-divider');
                    parent.querySelector('p:first-child').classList.replace('text-primary', 'text-on-surface');
                    parent.querySelector('p:first-child').classList.remove('font-bold');
                    parent.querySelector('span').classList.replace('text-primary', 'text-on-surface');
                });
                
                const activeParent = e.target.parentElement;
                activeParent.classList.add('border-primary', 'bg-primary/5');
                activeParent.classList.remove('border-divider');
                activeParent.querySelector('p:first-child').classList.replace('text-on-surface', 'text-primary');
                activeParent.querySelector('p:first-child').classList.add('font-bold');
                activeParent.querySelector('span').classList.replace('text-on-surface', 'text-primary');
            });
        });

        // Editor selection placeholder (visual only)
        document.addEventListener('selectionchange', () => {
            const selection = window.getSelection();
            if (selection.toString().length > 0) {
                // One could position a specialized toolbar here
            }
        });
    </script>
</body></html>
